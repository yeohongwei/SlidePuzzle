<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Irish+Grover&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Sliding Puzzle</h1>
    <h2></h2>
    <div class="puzzle">
      <div class="tile" id="tile_1">1</div>
      <div class="tile" id="tile_2">2</div>
      <div class="tile" id="tile_3">3</div>
      <div class="tile" id="tile_4">4</div>
      <div class="tile" id="tile_5">5</div>
      <div class="tile" id="tile_6">6</div>
      <div class="tile" id="tile_7">7</div>
      <div class="tile" id="tile_8">8</div>
      <div class="tile" id="tile_e">e</div>
    </div>
    <div class="gameUpdate">
      <div>Moves: <span id="count">0</span></div>
      <div id="message"></div>
    </div>
    <div class="controls">
      <button class="play">Shuffle</button>
      <button class="numbering">Toggle Number</button>
    </div>
    <script src="app.js"></script>
  </body>
</html>
