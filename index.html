<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Sliding Puzzle</h1>
    <h2></h2>
    <div class="puzzle">
      <div class="tile grid grid_1" id="tile_1">1</div>
      <div class="tile grid grid_2" id="tile_2">2</div>
      <div class="tile grid grid_3" id="tile_3">3</div>
      <div class="tile grid grid_4" id="tile_4">4</div>
      <div class="tile grid grid_5" id="tile_5">5</div>
      <div class="tile grid grid_6" id="tile_6">6</div>
      <div class="tile grid grid_7" id="tile_7">7</div>
      <div class="tile grid grid_8" id="tile_8">8</div>
      <div class="tile grid grid_empty" id="tile_e">e</div>
    </div>
    <div class="gameUpdate">
      <div>Count: <span id="count">0</span></div>
      <div id="message"></div>
    </div>
    <button class="play">Start/Reset</button>
    <script src="app.js"></script>
  </body>
</html>
